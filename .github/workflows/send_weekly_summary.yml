name: Send Weekly Summary Email

# Runs every Sunday at 21:30 IST (16:00 UTC) - after the last daily update
# of the week, so the summary can include the full day's data. Adjust the
# cron expression below if you use a different timezone (see README.md).
on:
  schedule:
    - cron: "0 16 * * 0"  # Sunday 21:30 IST
  workflow_dispatch: {}

# Required so the final step can commit the updated database back to the
# repo. See the matching comment in send_progress_email.yml for details.
permissions:
  contents: write

jobs:
  send-weekly-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send weekly summary email
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          APP_TIMEZONE: "Asia/Kolkata"
        run: python scheduler/send_update.py --type weekly

      - name: Commit updated database (email log)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tracker.db
          git diff --quiet --cached || git commit -m "chore: update tracker data [skip ci]"
          git push
